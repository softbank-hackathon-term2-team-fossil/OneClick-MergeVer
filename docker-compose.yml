# SBSB's own database (projects, saved servers, deployment history). Not a database for deployed apps.
# Port 5434 avoids clashing with a local Postgres (5432) or OneClick's (5433).
services:
  db:
    image: postgres:17-alpine
    container_name: sbsb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sbsb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sbsb}
      POSTGRES_DB: ${POSTGRES_DB:-sbsb}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - sbsb_pgdata:/var/lib/postgresql/data

volumes:
  sbsb_pgdata:
